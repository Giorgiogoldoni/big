<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>big – classifica dei sistemi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{margin:0;background:#fff;color:#1a1a1a;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header,.bar,.wrap,.note{padding:12px 18px}header{padding-bottom:0}h1{margin:0;font-size:22px}h3{margin:0 0 6px}.sub{color:#666;font-size:12px;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}input,select,button{font:inherit;padding:6px 10px;border:1px solid #c9ccd1;border-radius:6px;background:#fff}button{cursor:pointer}button:hover{background:#f3f4f6}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid #eceef1;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#fff;cursor:pointer;font-weight:600;border-bottom:2px solid #d5d8dd}
td.n{text-align:right}.neg{color:#c0392b}.pos{color:#1e8449}a{color:#1d4ed8;text-decoration:none}a:hover{text-decoration:underline}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.tag{font-size:11px;border-radius:4px;padding:1px 5px;margin-left:5px;background:#eee;color:#555}.ok{background:#e8f5e9;color:#1e8449}.nv{background:#fff3e0;color:#b45309}.note{font-size:12px;color:#555;max-width:1100px}
tr.r{cursor:pointer}tr.dt td{background:#fafbfc;padding:8px 18px}.sm th{cursor:default;position:static}
</style></head><body>
<header><h1>big – classifica dei sistemi per ETF</h1><div class="sub" id="sub">Caricamento…</div></header>
<div class="bar">
<input id="q" placeholder="Cerca ticker, nome, ISIN" size="24">
<select id="ori"><option value="5">+5 barre</option><option value="10" selected>+10 barre</option><option value="20">+20 barre</option><option value="60">+60 barre</option></select>
<select id="esi"><option value="">Tutti gli esiti</option><option value="ok">Affidabile</option><option value="nv">Non verificato</option><option value="no">Nessun sistema</option><option value="nd">Dati insufficienti</option></select>
<select id="sis"><option value="">Tutti i sistemi</option></select>
<select id="lev"><option value="">Tutti (ETF, leva, inversi)</option><option value="n">Solo ETF normali</option><option value="l">Solo leva e inversi</option></select>
<select id="emi"><option value="">Tutti gli emittenti</option></select>
<button id="xls">Scarica Excel</button><a href="data/regole_big.pdf" target="_blank"><button>Regole PDF</button></a><a href="index.html"><button>Elenco</button></a>
<span id="cnt" class="sub"></span></div>
<div class="note" id="leg"></div>
<div class="wrap"><h3>Quanto funziona ciascun sistema, su tutti gli ETF</h3><table class="sm"><thead><tr><th>Sistema</th><th>ETF misurabili</th><th>Con eccesso positivo</th><th>Eccesso mediano</th><th>Affidabile</th></tr></thead><tbody id="sm"></tbody></table></div>
<div class="wrap"><h3>Miglior sistema per ETF (clic su una riga per vedere tutti i sistemi)</h3><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
<script>
const $=id=>document.getElementById(id),fix=n=>String(n).replace(/'/g,"’");
const CLA={equity:"Azionari",bond:"Obbligazionari",commodity:"Materie prime",crypto:"Cripto",leva_short:"Leva / short"},ES={ok:"affidabile",nv:"non verificato",no:"nessuno",nd:"dati insufficienti"};
let C=null,S=[],I={},sort={k:"migs",d:-1},aperte=new Set(),RR=[];
Promise.all([fetch("data/classifica.json").then(r=>{if(!r.ok)throw 0;return r.json()}),fetch("data/index.json").then(r=>r.json())]).then(([c,ix])=>{
 C=c;S=ix.sistemi;ix.righe.forEach(r=>I[r.t]=r);
 $("sub").textContent="Classifica calcolata "+c.gen+" · storia fino a 5 anni (meno per gli ETF recenti) · rendimenti lordi, nessuna simulazione di operazioni";
 S.forEach(s=>$("sis").add(new Option(s.nome,s.id)));[...new Set(ix.righe.map(r=>r.e))].sort().forEach(e=>$("emi").add(new Option(e,e)));
 $("leg").innerHTML="<b>Come si legge.</b> Dopo ogni freccia si misura il rendimento della chiusura a +5, +10, +20 o +60 barre. <b>Eccesso</b> = rendimento mediano dopo i segnali meno il rendimento mediano dello stesso ETF in tutti i giorni. <b>Affidabile</b> = eccesso positivo, positivo anche nelle due metà della storia (prima e seconda) e t ≥ "+c.tmin+" su segnali non sovrapposti; <b>non verificato</b> = eccesso positivo ma manca una prova; si giudica solo con almeno "+c.minimo+" segnali. Su dati casuali il test segnala “affidabile” nel 4% degli ETF a +10 barre: il passato non è una previsione, e scegliere il migliore tra 9 sistemi favorisce il caso. Le colonne metà e t spiegano perché.";
 head();draw()}).catch(()=>$("sub").textContent="La classifica non è ancora stata calcolata: il workflow “Aggiorna big” la produce il sabato, oppure avvialo a mano con “classifica” attivo.");
const cols=[["t","Ticker"],["n","Nome"],["e","Emittente"],["migs","Miglior sistema"],["ns","Segnali"],["hit","% positivi"],["med","Mediana %"],["exc","Eccesso %"],["e1","Ecc. 1ª metà"],["e2","Ecc. 2ª metà"],["tt","t"],["yrs","Storia (anni)"]];
function head(){$("th").innerHTML=cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join("");$("th").onclick=e=>{const k=e.target.dataset.k;if(!k)return;sort={k,d:sort.k==k?-sort.d:-1};draw()}}
const okv=v=>v[0]>=C.minimo&&v[3]>0&&v[4]!=null&&v[5]!=null&&v[4]>0&&v[5]>0&&v[8]!=null&&v[8]>=C.tmin;
const med=a=>{if(!a.length)return null;a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const f=(x,d=1)=>x==null?"–":(x>0?"+":"")+x.toFixed(d),cl=x=>x==null?"":x<0?"neg":"pos";
function rows(){const O=$("ori").value,q=$("q").value.toLowerCase(),es=$("esi").value,si=$("sis").value,lv=$("lev").value,em=$("emi").value;
 return C.righe.map(r=>{const m=r.mig[O]||[null,"nd"],v=m[0]&&r.st[O][m[0]],i=I[r.t]||{};
  return {r,i,m,v,migs:(m[1]=="ok"?3000:m[1]=="nv"?2000:m[1]=="no"?1000:0)+(v?v[3]:0),ns:v?v[0]:-1,hit:v?v[1]:-1,med:v?v[2]:-99,exc:v?v[3]:-99,e1:v&&v[4]!=null?v[4]:-99,e2:v&&v[5]!=null?v[5]:-99,tt:v&&v[8]!=null?v[8]:-99,yrs:r.b/252,t:r.t,n:i.n||"",e:i.e||""}})
 .filter(x=>(!q||(x.t+x.n+(x.i.i||"")).toLowerCase().includes(q))&&(!es||x.m[1]==es)&&(!si||x.m[0]==si)&&(!em||x.e==em)&&(!lv||(lv=="l")==!!(x.i.lv||x.i.inv)))
 .sort((a,b)=>{const p=a[sort.k],q2=b[sort.k];return (p>q2?1:p<q2?-1:0)*sort.d})}
function resumo(O){$("sm").innerHTML=S.map(s=>{const V=C.righe.map(r=>r.st[O]&&r.st[O][s.id]).filter(v=>v&&v[0]>=C.minimo);const pos=V.filter(v=>v[3]>0).length,ok=V.filter(okv).length,m=med(V.map(v=>v[3]));
  return `<tr><td><i class="dot" style="background:${s.colore}"></i>${s.nome}</td><td>${V.length}</td><td>${V.length?Math.round(100*pos/V.length)+"%":"–"}</td><td class="${cl(m)}">${f(m)}%</td><td>${ok} (${V.length?Math.round(100*ok/V.length):0}%)</td></tr>`}).join("")}
function dett(r,O){const st=r.st[O]||{};return `<tr class="dt"><td colspan="${cols.length}"><table class="sm"><thead><tr><th>Sistema</th><th>Segnali</th><th>% positivi</th><th>Mediana %</th><th>Eccesso %</th><th>Ecc. 1ª metà</th><th>Ecc. 2ª metà</th><th>t</th><th>Esito</th></tr></thead><tbody>`+S.map(s=>{const v=st[s.id];
 return `<tr><td><i class="dot" style="background:${s.colore}"></i>${s.nome}</td>`+(v?`<td>${v[0]} (${r.ns[s.id]||0} totali)</td><td>${v[1]}%</td><td class="${cl(v[2])}">${f(v[2])}</td><td class="${cl(v[3])}">${f(v[3])}</td><td class="${cl(v[4])}">${f(v[4])} (${v[6]})</td><td class="${cl(v[5])}">${f(v[5])} (${v[7]})</td><td>${v[8]==null?"–":v[8]}</td><td>${v[0]<C.minimo?"dati insufficienti":okv(v)?"affidabile":v[3]>0?"non verificato":"negativo"}</td>`:`<td colspan="8">nessun segnale misurabile</td>`)+"</tr>"}).join("")+"</tbody></table></td></tr>"}
function draw(){const O=$("ori").value,R=rows();RR=R;resumo(O);$("cnt").textContent=R.length+" ETF";
 $("tb").innerHTML=R.slice(0,1000).map(x=>{const s=x.m[0]&&S.find(z=>z.id==x.m[0]);
  return `<tr class="r" data-t="${x.t}"><td><a href="grafico.html?t=${encodeURIComponent(x.t)}">${x.t}</a></td><td>${fix(x.n)}</td><td>${x.e}</td><td>${s?`<i class="dot" style="background:${s.colore}"></i>${s.nome}`:""}<span class="tag ${x.m[1]=="ok"?"ok":x.m[1]=="nv"?"nv":""}">${ES[x.m[1]]}</span></td>`+
  (x.v?`<td class="n">${x.v[0]}</td><td class="n">${x.v[1]}%</td><td class="n ${cl(x.v[2])}">${f(x.v[2])}</td><td class="n ${cl(x.v[3])}">${f(x.v[3])}</td><td class="n ${cl(x.v[4])}">${f(x.v[4])}</td><td class="n ${cl(x.v[5])}">${f(x.v[5])}</td><td class="n">${x.v[8]==null?"–":x.v[8]}</td>`:`<td colspan="7"></td>`)+`<td class="n">${x.yrs.toFixed(1)}</td></tr>`+(aperte.has(x.t)?dett(x.r,O):"")}).join("");
 if(R.length>1000)$("cnt").textContent+=" (primi 1000: usa i filtri o scarica l’Excel)"}
$("tb").onclick=e=>{if(e.target.tagName=="A")return;const tr=e.target.closest("tr.r");if(!tr)return;const t=tr.dataset.t;aperte.has(t)?aperte.delete(t):aperte.add(t);draw()};
["q","ori","esi","sis","lev","emi"].forEach(i=>$(i).addEventListener("input",draw));
$("xls").onclick=()=>{const O=$("ori").value;const out=RR.map(x=>{const o={Ticker:x.t,Nome:x.n,Emittente:x.e,["Miglior sistema +"+O]:x.m[0]?S.find(z=>z.id==x.m[0]).nome:"",Esito:ES[x.m[1]],"Storia (anni)":+x.yrs.toFixed(1)};
 S.forEach(s=>{const v=x.r.st[O]&&x.r.st[O][s.id];o[s.nome+" segnali"]=v?v[0]:"";o[s.nome+" % positivi"]=v?v[1]:"";o[s.nome+" mediana %"]=v?v[2]:"";o[s.nome+" eccesso %"]=v?v[3]:"";o[s.nome+" ecc. 1a meta %"]=v&&v[4]!=null?v[4]:"";o[s.nome+" ecc. 2a meta %"]=v&&v[5]!=null?v[5]:"";o[s.nome+" t"]=v&&v[8]!=null?v[8]:""});return o});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(out),"Classifica +"+O);XLSX.writeFile(wb,"big_classifica_"+O+".xlsx")};
</script></body></html>
